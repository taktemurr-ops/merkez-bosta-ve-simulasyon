name: merkez_bosta_ve_simulasyon
description: "Boşta ve Simülasyon merkez uygulaması. Offline-first Flutter game for Android, iOS and Web."
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # Ortak çekirdek: https://github.com/taktemurr-ops/studio-core
  studio_core:
    git:
      url: https://github.com/taktemurr-ops/studio-core
      ref: 921df6392b2121ffd438a286673ef9f10c988273
  # Merkezdeki oyunlar (her biri kendi deposunda)
  oyun_bosta_tiklayici:
    git:
      url: https://github.com/taktemurr-ops/oyun-bosta-tiklayici
      ref: main
  oyun_birlestir_gelistir:
    git:
      url: https://github.com/taktemurr-ops/oyun-birlestir-gelistir
      ref: main
  oyun_bosta_madencilik:
    git:
      url: https://github.com/taktemurr-ops/oyun-bosta-madencilik
      ref: main
  oyun_bosta_fabrika:
    git:
      url: https://github.com/taktemurr-ops/oyun-bosta-fabrika
      ref: main
  oyun_ciftlik:
    git:
      url: https://github.com/taktemurr-ops/oyun-ciftlik
      ref: main
  oyun_akvaryum_dekorasyonu:
    git:
      url: https://github.com/taktemurr-ops/oyun-akvaryum-dekorasyonu
      ref: main
  oyun_zen_bahcesi_bonsai:
    git:
      url: https://github.com/taktemurr-ops/oyun-zen-bahcesi-bonsai
      ref: main
  oyun_karinca_kolonisi:
    git:
      url: https://github.com/taktemurr-ops/oyun-karinca-kolonisi
      ref: main
  oyun_ari_kovani:
    git:
      url: https://github.com/taktemurr-ops/oyun-ari-kovani
      ref: main
  oyun_sanal_evcil_hayvan:
    git:
      url: https://github.com/taktemurr-ops/oyun-sanal-evcil-hayvan
      ref: main
  oyun_basit_sehir_kurma:
    git:
      url: https://github.com/taktemurr-ops/oyun-basit-sehir-kurma
      ref: main
  oyun_restoran_isletme:
    git:
      url: https://github.com/taktemurr-ops/oyun-restoran-isletme
      ref: main
  oyun_yemek_yapma:
    git:
      url: https://github.com/taktemurr-ops/oyun-yemek-yapma
      ref: main
  oyun_cay_bahcesi:
    git:
      url: https://github.com/taktemurr-ops/oyun-cay-bahcesi
      ref: main
  oyun_giydirme:
    git:
      url: https://github.com/taktemurr-ops/oyun-giydirme
      ref: main
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  shared_preferences: ^2.3.2
  audioplayers: ^6.5.0
  google_mobile_ads: ^9.2.0
  in_app_purchase: ^3.2.0

dependency_overrides:
  # Tüm oyunlar aynı çekirdek ve motor sürümlerini kullansın.
  studio_core:
    git:
      url: https://github.com/taktemurr-ops/studio-core
      ref: 921df6392b2121ffd438a286673ef9f10c988273
  simulasyon_motoru:
    git:
      url: https://github.com/taktemurr-ops/simulasyon-motoru
      ref: main

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/sfx/
    - assets/config/
    - assets/branding/

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: assets/branding/icon.png
  adaptive_icon_background: "#1F2A44"
  adaptive_icon_foreground: assets/branding/icon_foreground.png
  web:
    generate: true
    image_path: assets/branding/icon.png
    background_color: "#1F2A44"
    theme_color: "#1F2A44"

flutter_native_splash:
  color: "#1F2A44"
  image: assets/branding/splash.png
  android_12:
    color: "#1F2A44"
    image: assets/branding/splash_android12.png
  web: true
