name: merkez_bosta_ve_simulasyon
description: "Boşta ve Simülasyon merkez uygulaması. Offline-first Flutter game for Android, iOS and Web."
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

