  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  shared_preferences: ^2.3.2
  audioplayers: ^6.5.0
  google_mobile_ads: ^9.2.0
  in_app_purchase: ^3.2.0

dependency_overrides:
  # Tüm oyunlar aynı çekirdek ve motor sürümlerini kullansın.
  studio_core:
    git:
      url: https://github.com/taktemurr-ops/studio-core
      ref: 25c9e5cb2167cce4b7f65f57a214aacd9b2c1732
  simulasyon_motoru:
    git:
      url: https://github.com/taktemurr-ops/simulasyon-motoru
      ref: ae534580acee4c6d786f15971dc9dd56fcfc2e32

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/sfx/
    - assets/config/
    - assets/branding/
    - assets/approved/

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: assets/branding/icon.png
  adaptive_icon_background: "#1F2A44"
  adaptive_icon_foreground: assets/branding/icon_foreground.png
  web:
    generate: true
    image_path: assets/branding/icon.png
    background_color: "#1F2A44"
    theme_color: "#1F2A44"

flutter_native_splash:
  color: "#1F2A44"
  image: assets/branding/splash.png
  android_12:
    color: "#1F2A44"
    image: assets/branding/splash_android12.png
  web: true
