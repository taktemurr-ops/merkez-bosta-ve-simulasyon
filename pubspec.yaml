dependency_overrides:
  # Tüm oyunlar aynı çekirdek ve motor sürümlerini kullansın.
  studio_core:
    git:
      url: https://github.com/taktemurr-ops/studio-core
      ref: f730839949a9fc1ad4e685a525a41a02d9873757
  simulasyon_motoru:
    git:
      url: https://github.com/taktemurr-ops/simulasyon-motoru
      ref: 19d04d6e13fb39b15b853f141fadd414c16744e5

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/sfx/
    - assets/config/
    - assets/branding/
    - assets/approved/

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: assets/branding/icon.png
  adaptive_icon_background: "#1F2A44"
  adaptive_icon_foreground: assets/branding/icon_foreground.png
  web:
    generate: true
    image_path: assets/branding/icon.png
    background_color: "#1F2A44"
    theme_color: "#1F2A44"

flutter_native_splash:
  color: "#1F2A44"
  image: assets/branding/splash.png
  android_12:
    color: "#1F2A44"
    image: assets/branding/splash_android12.png
  web: true
